[theme]
base="dark"
primaryColor="#3b82f6"
backgroundColor="#09090b"
secondaryBackgroundColor="#18181b"
textColor="#f8fafc"
font="sans serif"

[browser]
gatherUsageStats = false

[server]
# Explicit rather than relying on defaults: these two guard the websocket/upload endpoints.
enableXsrfProtection = true
enableCORS = true

[client]
# Hides developer menu items (Deploy, bug reports) from end users.
toolbarMode = "minimal"
