daemon off;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    server {
        listen 8000;

        location = /auth/callback {
            default_type text/html;
            return 200 '<!DOCTYPE html><html><head><title>Confirming...</title></head><body><p>Confirming your account...</p><script>(function(){var h=window.location.hash;if(h&&h.indexOf("access_token=")!==-1){var p=new URLSearchParams(h.replace("#","?"));var t=p.get("access_token");if(t){window.location.href="/?confirm_token="+encodeURIComponent(t);return;}}window.location.href="/";})();</script></body></html>';
        }

        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}
