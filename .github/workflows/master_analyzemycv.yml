name: Build and deploy Python app to Azure Web App - analyzemycv

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Run tests
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests

      - name: Login to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DB5D6BFC239848FF8D4B80BDD69BEC84 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_95898585A26C4FBE8299EEBFAA256519 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DE5649E63E324F0F8EF90C09B80B4A0E }}

      - name: Deploy raw source to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: 'analyzemycv'
          slot-name: 'Production'
          package: '.'
          startup-command: 'chmod +x ./entrypoint.sh && ./entrypoint.sh'
